    var label = target? spark+'<span class="mono fs12 muted">'+target.c+'</span> <span class="fs13">'+shortName(target.n)+'</span> '+tierTag(target)
      : '<span class="muted fs13">Select Klay account…</span>';
    klayCell='<button class="btn btn-ghost btn-sm klay-dd" style="justify-content:space-between;width:100%;max-width:360px;font-weight:500" onclick="openKlayPicker('+idx+')">'+label+svg('chevDown')+'</button>';
  }
  var dimCell = deact? '<span class="muted">—</span>' : dimCellHTML(r,idx);
  var actionCell = actionCellHTML(r,idx);
  var rowCls = r.issue? ('row-'+r.issue.sev) : (deact?'row-deact':'');
  return '<tr class="'+rowCls+'" style="'+rowStyle+'">'
    + '<td><label class="rowchk"><input type="checkbox" '+(APP.mapSelected&&APP.mapSelected.indexOf(idx)>=0?'checked':'')+' onchange="toggleRowSelect('+idx+',this.checked)"></label></td>'
    + '<td>'+legCell+'</td><td>'+klayCell+'</td><td>'+dimCell+'</td><td>'+actionCell+'</td></tr>';
}
function shortName(n){ var i=n.indexOf('('); return i>0? n.slice(0,i).trim() : n; }

function dimCellHTML(r,idx){
  var chips=r.dims.map(function(d,di){
    var dim=dimById(d.dim);
    return '<span class="badge" style="background:'+hexA(dim.color,.12)+';color:'+dim.color+';border-color:'+hexA(dim.color,.3)+';font-size:10.5px">'+dim.name+': '+d.v+' <span class="clickable" style="opacity:.6" onclick="removeDim('+idx+','+di+')">×</span></span>';
  }).join(' ');
  // dimensions are optional here — required dimensions are enforced via Configure Klay CoA, not in this table
  return '<div class="flex g1 ac" style="flex-wrap:wrap;max-width:280px">'+chips
    + (chips?' ':'<span class="fs12 muted">Optional</span> ')
    + '<button class="btn btn-ghost btn-xs" onclick="openDimPicker('+idx+')">'+svg('plus')+'</button></div>';
}
function requiredDimsFor(r){
  // policy: cash/bank/AR/AP accounts require currency; P&L accounts require department
  if(!r.target) return [];
  var k=klayByCode(r.target); if(!k) return [];
  var req=[];
  if(['Assets','Liabilities'].indexOf(k.atype)>=0 && (k.group.indexOf('Cash')>=0||k.group.indexOf('Receivable')>=0||k.group.indexOf('Payable')>=0)) req.push('cur');
  if(['Revenue','COGS','Operating Expenses'].indexOf(k.atype)>=0) req.push('dept');
  return req;
}
function hexA(hex,a){ var h=hex.replace('#',''); var r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return 'rgba('+r+','+g+','+b+','+a+')'; }

function canConfirmRow(r){
  if(!r.target) return false;
  // hard/soft block prevents confirm; dimensions are optional in mapping
  if(r.issue && (r.issue.sev==='hard'||r.issue.sev==='soft')) return false;
  return true;
}
function actionCellHTML(r,idx){
  if(r.mapStatus==='deactivated'){
    return '<div class="flex g2 ac jc"><button class="btn btn-ghost btn-sm" onclick="reactivateRow('+idx+')">'+svg('replace')+'Reactivate</button></div>';
  }
  if(r.mapStatus==='later'){
    return '<div class="flex g2 ac jb"><span class="badge b-warning">'+svg('flag')+'For later</span>'+rowMenu(idx)+'</div>';
  }
  // No per-row Confirm / View button — confirmation is done in bulk.
  // mapped / auto / unmapped all just expose the row menu (⋯).
  return '<div class="flex g2 ac" style="justify-content:flex-end">'+rowMenu(idx)+'</div>';
}
function rowMenu(idx){
  return '<div style="position:relative"><button class="x-btn" onclick="toggleRowMenu(event,'+idx+')">'+svg('dots')+'</button></div>';
}
function toggleRowMenu(e,idx){
  e.stopPropagation();
  var r=APP.mapRows[idx];
  var items='';
  if(r.mapStatus!=='later' && r.mapStatus!=='mapped') items+='<div class="menu-item" onclick="markLater('+idx+')">'+svg('flag')+'Mark for later</div>';
  if(r.mapStatus==='later') items+='<div class="menu-item" onclick="unmarkLater('+idx+')">'+svg('replace')+'Move back to active</div>';
  items+='<div class="menu-item" onclick="openKlayPicker('+idx+')">'+svg('edit')+'Change Klay account</div>';
  items+='<div class="menu-item danger" onclick="deactivateRow('+idx+')">'+svg('trash')+'Deactivate account</div>';
  var menu='<div class="rowmenu" id="rowmenu">'+items+'</div>';
  closeRowMenu();
  var wrap=e.currentTarget.parentNode; wrap.insertAdjacentHTML('beforeend',menu);
  document.addEventListener('click',closeRowMenu,{once:true});
}
function closeRowMenu(){ var m=document.getElementById('rowmenu'); if(m)m.remove(); }
function closeAnchoredMenu(){ var m=document.getElementById('anchmenu'); if(m)m.remove(); }
function openAnchoredMenu(anchorEl,menuHTML,wide){
  closeAnchoredMenu();
  var wrap=anchorEl;
  if(getComputedStyle(wrap).position==='static') wrap.style.position='relative';
  var w = wide? 'min-width:300px' : 'min-width:200px';
  wrap.insertAdjacentHTML('beforeend','<div class="rowmenu" id="anchmenu" style="top:calc(100% + 6px);left:0;right:auto;'+w+'" onclick="event.stopPropagation()">'+menuHTML+'</div>');
  setTimeout(function(){ document.addEventListener('click',closeAnchoredMenu,{once:true}); },0);
}

/* ---- klay account picker (grouped, searchable) ---- */
function openKlayPicker(idx){
  var r=APP.mapRows[idx];
  var groups=KLAY_COA.map(function(grp){
    var its=grp.items.map(function(it){
      return '<div class="picker-item" onclick="setKlayTarget('+idx+',\''+it.c+'\')"><span class="mono fs12 muted" style="width:54px;display:inline-block">'+it.c+'</span><span class="fs13">'+it.n+'</span> '+tierTag(it)+'</div>';
    }).join('');
    return '<div class="picker-group"><div class="picker-group-h">'+grp.g+'</div>'+its+'</div>';
  }).join('');
  openDrawer('<div class="drawer-head"><div><div class="section-label mb2">Map to Klay account</div><div class="fw7 fs17" style="font-family:var(--font-display);font-weight:500">'+r.name+'</div><div class="mono fs12 muted mt1">'+r.code+' · '+r.ltype+'</div></div><button class="x-btn" onclick="closeDrawer()">'+svg('x')+'</button></div>'
    + '<div style="padding:14px 20px 0"><div class="flex ac g2" style="border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:8px 12px"><span style="color:var(--color-text-tertiary)">'+svg('search')+'</span><input id="klaySearch" placeholder="Search code or name…" oninput="filterPicker()" style="border:none;outline:none;flex:1;font-size:13px;background:transparent"></div></div>'
    + '<div class="drawer-body" id="pickerBody" style="padding-top:12px">'+groups+'</div>'
    + '<style>.picker-group-h{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--color-text-tertiary);padding:10px 0 4px;position:sticky;top:0;background:#fff}.picker-item{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer}.picker-item:hover{background:var(--color-action-wash)}</style>');
}
function filterPicker(){
  var q=document.getElementById('klaySearch').value.toLowerCase();
  var items=document.querySelectorAll('#pickerBody .picker-item');
  items.forEach(function(it){ it.style.display = it.textContent.toLowerCase().indexOf(q)>=0?'':'none'; });
  document.querySelectorAll('#pickerBody .picker-group').forEach(function(g){
    var any=Array.prototype.some.call(g.querySelectorAll('.picker-item'),function(i){return i.style.display!=='none';});
    g.style.display=any?'':'none';
  });
}
function setKlayTarget(idx,code){
  var r=APP.mapRows[idx];
  var hadIssue=!!r.issue;
  r.target=code; r.issue=null; // editing resolves any issue
  if(r.mapStatus!=='deactivated') r.mapStatus='mapped'; // editing the target maps it directly (no separate confirm)
  // when a previously-issue row is edited, drop it just below the "note" rows so it doesn't jump far
  if(hadIssue){ reorderEditedRow(idx); }
  closeDrawer(); renderPage();
  toast('Account mapped','Mapped to '+code+'.','success');
}
function reorderEditedRow(idx){
  // After editing, the row loses its issue and falls into the "resolved" bucket (3).
  // Give it a small ord so it sorts to the TOP of that bucket — i.e. right below the note rows.
  var minOrd=Infinity;
  APP.mapRows.forEach(function(r,i){ if(i!==idx && rowSortKey(r)===3 && r.ord<minOrd) minOrd=r.ord; });
  APP.mapRows[idx].ord = (minOrd===Infinity? 0 : minOrd-0.5);
}

/* ---- dimension picker ---- */
function openDimPicker(idx){
  var r=APP.mapRows[idx];
  var req=requiredDimsFor(r);
  var blocks=DIMS.map(function(d){
    var current=r.dims.filter(function(x){return x.dim===d.id;})[0];
    var isReq=req.indexOf(d.id)>=0;
    var vals=d.values.map(function(v){
      var sel=current&&current.v===v;
      return '<button class="dimchip'+(sel?' sel':'')+'" style="'+(sel?'--c:'+d.color:'')+'" onclick="addDimVal('+idx+',\''+d.id+'\',\''+v+'\')">'
        + (sel?'<span class="dimchip-check">'+svg('check')+'</span>':'')+v+'</button>';
    }).join('');
    var clearBtn = current? '<button class="btn btn-ghost btn-xs" onclick="clearDim('+idx+',\''+d.id+'\')">'+svg('x')+'Clear</button>':'';
    return '<div class="mb5"><div class="flex jb ac mb3"><span class="flex ac g2 fw7 fs13"><span class="dot" style="background:'+d.color+'"></span>'+d.name
      + (d.ai?' <span class="ai-pill">'+svg('spark')+'AI</span>':'')+'</span>'
      + (isReq?'<span class="badge b-warning" style="font-size:10px">'+svg('alert')+'Required</span>':clearBtn)+'</div>'
      + '<div class="flex g2 ac" style="flex-wrap:wrap">'+vals+'</div></div>';
  }).join('');
  openDrawer('<div class="drawer-head"><div><div class="section-label mb2">Assign dimension values</div><div class="fw7 fs17" style="font-family:var(--font-display);font-weight:500">'+r.name+'</div><div class="mono fs12 muted mt1">'+r.code+'</div></div><button class="x-btn" onclick="closeDrawer()">'+svg('x')+'</button></div>'
    + '<div class="drawer-body">'
      + '<div class="ai-banner mb5">'+svg('spark')+'<div><div class="fw7 fs13" style="color:var(--color-brand-hover)">Some dimensions are required for this account</div><div class="fs12" style="color:var(--color-text-secondary);line-height:1.5;margin-top:2px">Pick a value for each required dimension. Tap a chip to select; the highlighted chip is the current value.</div></div></div>'
      + blocks
    + '</div>'
    + '<div class="drawer-foot"><button class="btn btn-primary" onclick="closeDrawer();renderPage()">Done</button></div>');
}
function clearDim(idx,dimId){ var r=APP.mapRows[idx]; r.dims=r.dims.filter(function(x){return x.dim!==dimId;}); renderPage(); openDimPicker(idx); }
function addDimVal(idx,dimId,v){
  var r=APP.mapRows[idx];
  var ex=r.dims.filter(function(x){return x.dim===dimId;})[0];
  if(ex) ex.v=v; else r.dims.push({dim:dimId,v:v});
  // refresh drawer + page silently
  renderPage(); openDimPicker(idx);
}
function removeDim(idx,di){ APP.mapRows[idx].dims.splice(di,1); renderPage(); }

/* ---- row actions ---- */
function confirmRow(idx){ var r=APP.mapRows[idx]; r.mapStatus='mapped'; renderPage(); }
function acknowledgeIssue(idx){
  var r=APP.mapRows[idx];
  if(!r.issue) return;
  var label=r.issue.label;
  r.issue=null; // dismiss the (note) issue; row keeps its existing mapStatus
  reorderEditedRow(idx); // drop it below the remaining note rows so it doesn't jump far
  renderPage();
  toast('Noted','“'+label+'” acknowledged and cleared from this account.','success');
}
function markLater(idx){ closeRowMenu(); APP.mapRows[idx].mapStatus='later'; renderPage(); toast('Marked for later','Moved to the bottom of the list.','info'); }
function unmarkLater(idx){ closeRowMenu(); var r=APP.mapRows[idx]; r.mapStatus=r.target?'manual':'unmapped'; renderPage(); }
function deactivateRow(idx){ closeRowMenu(); APP.mapRows[idx].mapStatus='deactivated'; renderPage(); toast('Account deactivated','It will not be migrated.','info'); }
function reactivateRow(idx){ var r=APP.mapRows[idx]; r.mapStatus=r.target?'mapped':'unmapped'; renderPage(); }
function setMapFilter(f){ APP.mapFilter=f; APP.mapIssueFilter=null; APP.mapPage=1; renderPage(); }
function bulkBar(){
  var sel=selectedRows();
  if(!sel.length) return '';
  var nConfirm=sel.filter(function(r){return r.mapStatus==='auto'&&canConfirmRow(r);}).length;
  var nLater=sel.filter(function(r){return r.mapStatus!=='mapped'&&r.mapStatus!=='deactivated';}).length;
  var nDeact=sel.filter(function(r){return r.mapStatus!=='deactivated';}).length;
  return '<div class="bulkbar mb4">'
    + '<div class="flex ac g3"><span class="badge b-info">'+sel.length+' selected</span>'
    + '<button class="clickable fs12 fw6" style="color:var(--color-text-tertiary);background:none;border:none" onclick="clearSelection()">Clear selection</button></div>'
    + '<div class="flex g2 ac">'
      + '<button class="btn btn-primary btn-sm" '+(nConfirm?'onclick="bulkConfirm()"':'disabled')+'>'+svg('check')+'Confirm ('+nConfirm+')</button>'
      + '<button class="btn btn-ghost btn-sm" '+(nLater?'onclick="bulkMarkLater()"':'disabled')+'>'+svg('flag')+'Mark for later ('+nLater+')</button>'
      + '<button class="btn btn-danger-ghost btn-sm" '+(nDeact?'onclick="bulkDeactivate()"':'disabled')+'>'+svg('trash')+'Deactivate ('+nDeact+')</button>'
    + '</div></div>';
}
function toggleRowSelect(idx,on){
  APP.mapSelected=APP.mapSelected||[];
  var i=APP.mapSelected.indexOf(idx);
  if(on && i<0) APP.mapSelected.push(idx);
  else if(!on && i>=0) APP.mapSelected.splice(i,1);
  renderPage();
}
function toggleSelectAll(on){
  APP.mapSelected = on ? APP.mapRows.map(function(r,i){return i;}) : [];
  renderPage();
}
function clearSelection(){ APP.mapSelected=[]; renderPage(); }
function selectedRows(){ return (APP.mapSelected||[]).map(function(i){return APP.mapRows[i];}); }
function bulkConfirm(){
  var n=0; selectedRows().forEach(function(r){ if(r.mapStatus==='auto' && canConfirmRow(r)){ r.mapStatus='mapped'; n++; } });
  APP.mapSelected=[]; renderPage();
  toast(n+' accounts mapped', n?'Bulk action applied to AI-suggested rows.':'Only AI-suggested rows without blocking issues can be confirmed in bulk.', n?'success':'info');
}
function bulkMarkLater(){
  var n=0; selectedRows().forEach(function(r){ if(r.mapStatus!=='mapped' && r.mapStatus!=='deactivated'){ r.mapStatus='later'; n++; } });
  APP.mapSelected=[]; renderPage(); toast(n+' accounts marked for later','','info');
}
function bulkDeactivate(){
  var n=0; selectedRows().forEach(function(r){ if(r.mapStatus!=='deactivated'){ r.mapStatus='deactivated'; n++; } });
  APP.mapSelected=[]; renderPage(); toast(n+' accounts deactivated','They will not be migrated.','info');
}
function bulkConfirmAuto(){
  var n=0;
  APP.mapRows.forEach(function(r){
    if(r.mapStatus==='auto' && canConfirmRow(r)){ r.mapStatus='mapped'; n++; }
  });
  renderPage();
  toast(n+' accounts mapped', n? 'AI suggestions accepted in bulk.':'No AI-suggested rows ready — some have blocking issues.', n?'success':'info');
}
function legDot(color,label,n){ return '<span class="legend-item"><span class="dot" style="background:'+color+'"></span>'+label+' ('+n+')</span>'; }
function exitWorkspace(){ APP.ws=false; render(); }
function finishMapping(){ toast('Mapping complete','Great — moving on to tax config.','success'); setTimeout(function(){ jumpStage(3); },500); }
</script>

<script>
/* ============================================================
   STAGE 2 — CONFIGURE KLAY CoA  &  CONFIGURE DIMENSIONS
   ============================================================ */
function openConfigCoa(){ APP.wsSub='configCoa'; render(); }
function openConfigDims(){ APP.wsSub='configDims'; render(); }
function backToWorkspace(){ APP.wsSub=null; render(); }

function renderConfigCoa(){
  var groups=KLAY_COA.map(function(grp){
    var rows=grp.items.map(function(it){
      var locked = it.tier==='HARD';
      var tierBadge = it.tier==='HARD'?'<span class="badge b-danger" style="font-size:10px">'+svg('lock')+'Hard-locked</span>'
        : it.tier==='SOFT'?'<span class="badge b-warning" style="font-size:10px">'+svg('lock')+'Soft-locked</span>'
        : '<span class="badge b-success" style="font-size:10px">'+svg('edit')+'Editable</span>';

      + '<div class="card" style="overflow:hidden"><table class="tbl"><thead><tr><th style="width:120px">Code</th><th>Account name</th><th style="width:130px">Lock tier</th><th>Required dimensions</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  }).join('');

  return '<div class="canvas">'
    + '<div class="flex ac g2 fs13 mb4"><span class="clickable" style="color:var(--color-action);font-weight:600" onclick="backToWorkspace()">Account Mapping</span><span class="muted">/</span><span class="muted">Configure Klay CoA</span></div>'

      + '<div class="page-sub mt2">Rename accounts, adjust the last 2 digits of a code, and set which <b>dimensions are required</b> on each account. Required dimensions must be filled in before a transaction can post. You assign the actual dimension <i>values</i> later, in the mapping workspace.</div></div>'

        + lockTierCard('b-danger','lock','Hard-locked','System-managed accounts (AR, AP, tax, retained earnings). Code and behaviour are fixed — they drive the posting engine, so they can\'t be renamed or recoded.')

    + '.cfg-edit{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);padding:4px 8px;max-width:400px;background:#fff;transition:border-color var(--tf)}'
    + '.cfg-edit:focus-within{border-color:var(--color-action)}'

    + '.cfg-code:focus{outline:none;border-color:var(--color-action)}'

}
function defaultReqDims(it){
  // sensible defaults mirroring requiredDimsFor
  var req=[];
  if(['Assets','Liabilities'].indexOf(it.atype)>=0 && (it.group.indexOf('Cash')>=0||it.group.indexOf('Receivable')>=0||it.group.indexOf('Payable')>=0)) req.push('cur');
  if(['Revenue','COGS','Operating Expenses'].indexOf(it.atype)>=0) req.push('dept');
  return req;
}
function getAcctReqDims(code){ var it=klayByCode(code); return (APP.acctReqDims&&APP.acctReqDims[code]) || defaultReqDims(it||{atype:'',group:''}); }
function toggleAcctReqDim(code,did){
  APP.acctReqDims=APP.acctReqDims||{};
  var cur=APP.acctReqDims[code]||defaultReqDims(klayByCode(code)||{atype:'',group:''});
  var i=cur.indexOf(did);
  if(i>=0) cur=cur.filter(function(x){return x!==did;}); else cur=cur.concat([did]);
  APP.acctReqDims[code]=cur; renderPage();
}
function openReqDimPicker(code){
  var cur=getAcctReqDims(code);
  var it=klayByCode(code);
  var opts=DIMS.filter(function(d){return !d.system;}).map(function(d){
    var on=cur.indexOf(d.id)>=0;
    return '<button class="dimchip'+(on?' sel':'')+'" style="'+(on?'--c:'+d.color:'')+'" onclick="toggleAcctReqDim(\''+code+'\',\''+d.id+'\');refreshReqDimPicker(\''+code+'\')">'
      + (on?'<span class="dimchip-check">'+svg('check')+'</span>':'')+d.name+(d.ai?' <span style="opacity:.7">✦</span>':'')+'</button>';
  }).join(' ');
  openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--color-action-wash)"><svg viewBox="0 0 24 24" style="stroke:var(--color-action)">'+IC.layers+'</svg></div>'
    + '<div class="modal-title">Required dimensions</div>'
    + '<div class="modal-text">Choose which dimensions <b>must</b> be filled for <b>'+(it?shortName(it.n):code)+'</b> before a transaction can post. This sets the rule — values are assigned later per account.</div>'
    + '<div id="reqDimOpts" class="flex g2 ac" style="flex-wrap:wrap">'+opts+'</div>'
    + '<div class="modal-foot"><button class="btn btn-primary" onclick="closeModal()">Done</button></div></div>');
}
function refreshReqDimPicker(code){
  var cur=getAcctReqDims(code);
  var el=document.getElementById('reqDimOpts'); if(!el) return;
  el.innerHTML=DIMS.filter(function(d){return !d.system;}).map(function(d){
    var on=cur.indexOf(d.id)>=0;
    return '<button class="dimchip'+(on?' sel':'')+'" style="'+(on?'--c:'+d.color:'')+'" onclick="toggleAcctReqDim(\''+code+'\',\''+d.id+'\');refreshReqDimPicker(\''+code+'\')">'
      + (on?'<span class="dimchip-check">'+svg('check')+'</span>':'')+d.name+(d.ai?' <span style="opacity:.7">✦</span>':'')+'</button>';
  }).join(' ');
}
function editKlayName(code,v){ var it=klayByCode(code); if(it){it.n=v; toast('Account renamed','Saved “'+shortName(v)+'”.','success');} }
function editKlaySuffix(code,v){
  v=(v||'').replace(/[^0-9]/g,'').padStart(2,'0').slice(0,2);
  toast('Code updated','New code '+code.slice(0,3)+v+'. Existing mappings keep pointing to this account.','info');
}
function lockTierCard(badge,icon,title,desc){
  return '<div style="border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:14px">'

function addChildAccount(groupName,prefix){

      + '<div><div class="section-label mb2">Code</div>'
        + '<div class="addacct-code"><span class="addacct-prefix mono">'+prefix+'</span><input id="newCode" class="addacct-suffix mono" maxlength="2" placeholder="90"></div></div>'
      + '<div><div class="section-label mb2">Account name</div>'
        + '<input id="newName" class="addacct-name" placeholder="e.g. Bank BTN (IDR)"></div>'
    + '</div>'
    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doAddChild(\''+groupName+'\',\''+prefix+'\')">'+svg('plus')+'Add account</button></div>'
    + '<style>.addacct-code{display:flex;align-items:stretch;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);overflow:hidden;height:42px}.addacct-prefix{display:flex;align-items:center;padding:0 12px;background:var(--color-surface-sunken);color:var(--color-text-tertiary);font-size:15px;border-right:1px solid var(--color-border-default)}.addacct-suffix{flex:1;border:none;outline:none;padding:0 12px;font-size:15px;text-align:center;background:#fff}.addacct-suffix:focus{background:var(--color-action-wash)}.addacct-name{width:100%;height:42px;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);padding:0 14px;font-size:14px;font-family:var(--font-sans)}.addacct-name:focus{outline:none;border-color:var(--color-action)}</style></div>');
}
function doAddChild(groupName,prefix){
  var code=prefix+((document.getElementById('newCode').value||'90').replace(/[^0-9]/g,'').padStart(2,'0').slice(0,2));
  var name=document.getElementById('newName').value||'New Account';
  var grp=KLAY_COA.filter(function(g){return g.g===groupName;})[0];
  if(grp){ grp.items.push({c:code,n:name,tier:'NONE',group:grp.g,atype:grp.type}); KLAY_FLAT.push(grp.items[grp.items.length-1]); }
  closeModal(); render();
  toast('Account added',code+' · '+name+' is now available for mapping.','success');

function renderConfigDims(){
  var blocks=DIMS.map(function(d){

      '<div class="dimadd"><span class="dimadd-ic">'+svg('plus')+'</span><input class="dimadd-in" placeholder="Add a '+d.name.toLowerCase()+' value…" onkeydown="if(event.key===\'Enter\'){doAddDimValInline(\''+d.id+'\',this)}"><button class="btn btn-soft btn-sm" onclick="doAddDimValInline(\''+d.id+'\',this.previousElementSibling)">Add</button></div>';

    return '<div class="card card-pad mb4"><div class="flex jb ac mb3"><div class="flex ac g3"><span class="dot" style="background:'+d.color+';width:12px;height:12px"></span><span class="fw7 fs15">'+d.name+'</span>'+recBadge+(d.system?'':'<span class="badge b-success" style="font-size:10px">Active</span>')+'</div>'

  }).join('');
  var dimStyle='<style>'
    + '.dimvals{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}'
    + '.dimval{display:inline-flex;align-items:center;gap:4px;background:var(--color-surface-sunken);border:1px solid var(--color-border-default);border-radius:var(--radius-full);padding:5px 6px 5px 12px;font-size:12.5px;font-weight:600;color:var(--color-text-secondary)}'
    + '.dimval-x{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:none;background:none;border-radius:50%;color:var(--color-text-tertiary);cursor:pointer}.dimval-x:hover{background:var(--danger-surface);color:var(--danger-text)}.dimval-x svg{width:12px;height:12px}'
    + '.dimadd{display:flex;align-items:center;gap:8px;border:1px dashed var(--color-border-strong);border-radius:var(--radius-md);padding:6px 8px 6px 12px;max-width:380px}'
    + '.dimadd:focus-within{border-color:var(--color-action);border-style:solid}'
    + '.dimadd-ic{display:inline-flex;color:var(--color-text-tertiary)}.dimadd-ic svg{width:15px;height:15px}'
    + '.dimadd-in{flex:1;border:none;background:none;outline:none;font-size:13px;font-family:var(--font-sans);color:var(--color-text-primary)}'
    + '</style>';
  return '<div class="canvas narrow">'
    + '<div class="flex ac g2 fs13 mb4"><span class="clickable" style="color:var(--color-action);font-weight:600" onclick="backToWorkspace()">Mapping workspace</span><span class="muted">/</span><span class="muted">Configure Dimensions</span></div>'
    + '<div class="page-head-row"><div><div class="page-title" style="font-size:30px">Configure Dimensions</div>'
      + '<div class="page-sub mt2">Dimensions tag every transaction so you can slice reports by department, branch, currency and more. Add or remove values inline, then assign dimensions to accounts in the workspace.</div></div>'
      + '<div class="flex g2"><button class="btn btn-ghost" onclick="addDimensionPrompt()">'+svg('plus')+'New dimension</button><button class="btn btn-primary" onclick="backToWorkspace()">'+svg('check')+'Done</button></div></div>'

}
function doAddDimValInline(id,inputEl){
  var d=dimById(id); var v=(inputEl&&inputEl.value||'').trim();
  if(!v) return;

function deleteDimension(id){
  var d=dimById(id);

    + '<div class="modal-title">Delete “'+d.name+'” dimension?</div>'
    + '<div class="modal-text">This removes the dimension and all its values, and clears it from any accounts it was assigned to. This can\'t be undone.</div>'
    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-brand" style="background:var(--danger-text);border-color:var(--danger-text)" onclick="doDeleteDimension(\''+id+'\')">'+svg('trash')+'Delete dimension</button></div></div>');
}
function doDeleteDimension(id){
  DIMS=DIMS.filter(function(d){return d.id!==id;});
  // clear from any mapped rows + required-dim config
  if(APP.mapRows) APP.mapRows.forEach(function(r){ r.dims=r.dims.filter(function(x){return x.dim!==id;}); });
  if(APP.acctReqDims){ Object.keys(APP.acctReqDims).forEach(function(code){ APP.acctReqDims[code]=(APP.acctReqDims[code]||[]).filter(function(x){return x!==id;}); }); }
  closeModal(); render(); toast('Dimension deleted','It has been removed from your workspace.','info');
}
function addDimensionPrompt(){
  openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--color-action-wash)"><svg viewBox="0 0 24 24" style="stroke:var(--color-action)">'+IC.layers+'</svg></div>'

    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doAddDimension()">Create</button></div></div>');

function doAddDimension(){

}

<script>
/* ============================================================
   STAGE 3 — POSTING RULES SETUP
   Recommended design built from the Posting Logic PRD:
   each business event -> a DR/CR template + tax + dimension inference,
   confidence-gated, with system rules and vendor-specific overrides.
   ============================================================ */
function ensurePosting(){
  if(APP.rules) return;

  // No AI, no auto-post, no confidence, no trigger/category — these are reusable journal templates.
  APP.rules = [
    {id:'ap_inv', name:'Vendor Bill (AP Invoice)', status:'active', ai:true, recommend:'strong', saved:false,
     lines:[{dr:'Expense / Inventory (by item)',drc:'var'},{dr:'PPN Masukan',drc:'11400',tax:true},{cr:'Utang Usaha',crc:'21000',ctrl:true}],
     note:'PPN Masukan accrues when the vendor is PKP. PPh 23 (2%) is withheld on services to the matching tax-payable account.'},
    {id:'ar_inv', name:'Customer Invoice (AR Invoice)', status:'active', ai:true, recommend:'strong', saved:false,
     lines:[{dr:'Piutang Usaha',drc:'11200',ctrl:true},{cr:'Pendapatan Penjualan',crc:'41000'},{cr:'PPN Keluaran',crc:'22000',tax:true}],
     note:'COGS recognition posts a paired entry when the item is tracked inventory.'},
    {id:'ap_pay', name:'Vendor Payment', status:'active', ai:true, recommend:'strong', saved:false,
     lines:[{dr:'Utang Usaha',drc:'21000',ctrl:true},{cr:'Bank',crc:'11110'}],
     note:'Realized FX gain/loss posts for foreign-currency settlement.'},
    {id:'ar_rcpt', name:'Customer Receipt', status:'active', ai:true, recommend:'strong', saved:false,
     lines:[{dr:'Bank',drc:'11110'},{cr:'Piutang Usaha',crc:'11200',ctrl:true}],
     note:'Matches to the open invoice; partial receipts supported.'},
    {id:'payroll', name:'Payroll Run', status:'active', ai:true, recommend:'normal', saved:false,
     lines:[{dr:'Gaji & Upah',drc:'61000'},{cr:'Utang PPh 21',crc:'22100',tax:true},{cr:'Utang BPJS',crc:'22200',tax:true},{cr:'Bank / Accrued Salaries',crc:'21110'}],
     note:'PPh 21 and BPJS employee contributions are withheld to their payable accounts.'},
    {id:'expense', name:'Cash / Petty Expense', status:'active', ai:true, recommend:'normal', saved:false,
     lines:[{dr:'Operating Expense (by category)',drc:'var'},{cr:'Kas / Bank',crc:'11100'}],
     note:'PPN Masukan accrues if a valid faktur is attached.'},
    {id:'inv_adj', name:'Inventory Adjustment', status:'active', ai:true, recommend:'normal', saved:false,
     lines:[{dr:'COGS / Loss',drc:'51000'},{cr:'Persediaan',crc:'11620'}],
     note:'Used for stock-count differences and write-offs.'},
    {id:'depr', name:'Depreciation', status:'active', ai:true, recommend:'normal', saved:false,
     lines:[{dr:'Beban Penyusutan',drc:'63000'},{cr:'Akumulasi Penyusutan',crc:'12200',contra:true}],
     note:'Straight-line schedule generated from the Fixed Asset register.'}
  ];
}
// dimensions are derived from the required dimensions of the accounts a template touches
function postingRuleDims(r){
  var set={};
  (r.lines||[]).forEach(function(l){
    var code=l.drc||l.crc;
    if(!code||code==='var') return;
    var req=(APP.acctReqDims&&APP.acctReqDims[code])||[];
    req.forEach(function(d){ set[d]=1; });
  });
  return Object.keys(set);
}
function postingCounts(){
  var r=APP.rules; return { total:r.length, active:r.filter(function(x){return x.status==='active';}).length,
    saved:r.filter(function(x){return x.saved;}).length,
    aiUnsaved:r.filter(function(x){return x.ai&&!x.saved;}).length };
}
function renderPosting(){
  ensurePosting();
  var c=postingCounts();
  var cards='<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">'+APP.rules.map(postingCard).join('')+'</div>';

  var workspace = ''
    + aiPostingSummary(c)
    + '<div class="flex g2 ac mb5" style="align-items:flex-start;background:var(--color-action-wash);border:1px solid var(--color-action-subtle);border-radius:var(--radius-md);padding:12px 15px;font-size:12.5px;color:var(--color-action);line-height:1.55">'+svg('info')+'<span>These templates follow standard Indonesian SME bookkeeping. <b>Only the templates you save are carried into your live ERP</b> at go-live \u2014 review each one and hit Save. They never auto-post; nothing hits the ledger until someone approves it in the ERP.</span></div>'
    + '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px">'
      + statCard('Templates',c.total,'book','var(--color-action)')
      + statCard('Saved for go-live',c.saved,'checkCircle','var(--success-text)')
      + statCard('AI-drafted',c.total,'spark','var(--color-brand)')
    + '</div>'
    + '<div class="flex jb ac mb3"><span class="disp" style="font-size:18px">Journal templates <span class="pill-count">'+c.total+'</span></span>'

      + '<div class="flex g2">'+( postingCounts().saved>0

// AI summary acts as a shortcut to save ALL AI-suggested templates at once (like account mapping)

function statCard(label,val,icon,color){

    + '<div class="flex ac g3">'
      + '<div class="stat-ico" style="background:'+hexA(color,.1)+';color:'+color+'">'+svg(icon)+'</div>'

function postingCard(r){
  var idx=APP.rules.indexOf(r);
  var lines=r.lines.map(function(l){
    var isDr = !!l.dr;
    var name = isDr? l.dr : l.cr; var code = isDr? l.drc : l.crc;
    var codeTxt = (code&&code!=='var')? '<span class="mono fs11 muted">'+code+'</span> ':'';
    var tag = l.tax?'<span class="badge b-warning" style="font-size:9px">tax</span>':'';
    return '<div class="flex g2 ac" style="padding:3px 0;font-size:12px"><span class="badge '+(isDr?'b-info':'b-neutral')+'" style="font-size:9.5px;width:26px;justify-content:center">'+(isDr?'DR':'CR')+'</span>'+codeTxt+'<span class="sec" style="flex:1">'+name+'</span>'+tag+'</div>';
  }).join('');
  // AI + recommendation labels
  var aiTag = r.ai? '<span class="ai-pill">'+svg('spark')+'Generated by AI</span>':'';
  var recTag = r.recommend==='strong'
      ? '<span class="badge b-success" style="font-size:9.5px">'+svg('check')+'Strongly recommended</span>'
      : (r.recommend==='normal'? '<span class="badge b-info" style="font-size:9.5px">Recommended</span>':'');

    + '<div class="clickable" onclick="openPostingRule('+idx+')">'
    + '<div class="flex jb ac mb2" style="align-items:flex-start"><span class="fw7 fs15">'+r.name+'</span>'+(saved?'<span class="badge b-success" style="font-size:9.5px">'+svg('check')+'Saved</span>':'')+'</div>'
    + '<div class="flex g1 ac mb3" style="flex-wrap:wrap">'+aiTag+recTag+'</div>'
    + '<div style="background:var(--color-surface-base);border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);padding:8px 11px">'+lines+'</div></div>'
    + '<div class="flex jb ac" style="border-top:1px solid var(--color-border-subtle);padding-top:10px;margin-top:6px">'
      + '<span class="fs11 '+(saved?'':'muted')+'" style="'+(saved?'color:var(--success-text)':'')+'">'+(saved?'Will be created in your live ERP':'Not saved \u2014 won\u2019t go to the ERP yet')+'</span>'
      + '<div class="flex g2 ac">'
        + (saved
            ? '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();unsavePostingRule('+idx+')">'+svg('check')+'Saved</button>'
            : '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();savePostingRule('+idx+')">'+svg('check')+'Save</button>')
        + '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openPostingRule('+idx+')">'+svg('edit')+'Edit</button>'
        + '<button class="btn btn-ghost btn-sm" style="color:var(--danger-text)" onclick="event.stopPropagation();deletePostingRule('+idx+')">'+svg('trash')+'</button></div>'
    + '</div>'
  + '</div>';
}
function openPostingRule(idx){
  var r=APP.rules[idx];
  var lines=postingLinesEditor(idx);
  openDrawer('<div class="drawer-head"><div><div class="section-label mb2 flex ac g2">Posting template</div><div class="fw7 fs17" style="font-family:var(--font-display);font-weight:500">'+r.name+'</div></div><button class="x-btn" onclick="closeDrawer()">'+svg('x')+'</button></div>'
    + '<div class="drawer-body">'
      + '<div class="section-label mb2">Template name</div><input class="cfg-input2 mb5" value="'+r.name.replace(/"/g,'&quot;')+'" onchange="editPostingField('+idx+',\'name\',this.value)">'
      + '<div class="flex jb ac mb2"><span class="section-label">Journal template</span><button class="btn btn-ghost btn-xs" onclick="addPostingLine('+idx+')">'+svg('plus')+'Add line</button></div>'
      + '<div class="fs12 muted mb3">Pick the account for each line. Leave a line as <b>Dynamic</b> when the account is resolved at posting time (e.g. expense by item).</div>'
      + '<div class="mb5">'+lines+'</div>'
      + (r.note?'<div class="flex g2 ac mb5" style="align-items:flex-start;background:var(--color-surface-base);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:12px 14px;font-size:12.5px;color:var(--color-text-secondary);line-height:1.55">'+svg('info')+'<span>'+r.note+'</span></div>':'')
      + '<div class="hr"></div>'
      + '<button class="btn btn-danger-ghost btn-sm btn-block" onclick="deletePostingRule('+idx+')">'+svg('trash')+'Delete this template</button>'
    + '</div>'
    + '<div class="drawer-foot"><button class="btn btn-ghost" onclick="closeDrawer()">Close</button><button class="btn btn-primary" onclick="savePostingRule('+idx+')">'+svg('check')+'Save changes</button></div>'
    + postingSwitchStyle());
}
function postingSwitchStyle(){ return '<style>.cfg-input2{width:100%;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;font-family:var(--font-sans);background:#fff}.cfg-input2:focus{outline:none;border-color:var(--color-action)}</style>'; }
function markPostingEdited(idx){ /* templates are deterministic; editing just persists in place */ }
var POSTING_TRIGGERS=[
  'A vendor bill is received and approved',
  'A sales invoice is issued to a customer',
  'A bill is paid from a bank account',
  'Payment is received against an invoice',
  'Monthly payroll is finalized',
  'An out-of-pocket or petty cash expense is recorded',
  'Stock count or write-off adjusts inventory',
  'Goods are received against a purchase order',
  'A customer credit note is issued',
  'A vendor credit note is received',
  'A bank charge or interest is posted',
  'A fixed asset is acquired',
  'Runs automatically at each period close',
  'A manual journal is posted'
];
function triggerOptions(current){
  var opts=POSTING_TRIGGERS.slice();
  if(current && opts.indexOf(current)<0) opts.unshift(current);
  return opts.map(function(t){return '<option'+(t===current?' selected':'')+'>'+t+'</option>';}).join('');
}
function coaOptions(selectedCode){
  var opts='<option value="var"'+((!selectedCode||selectedCode==='var')?' selected':'')+'>— Dynamic (resolved at posting) —</option>';
  var byType={};
  KLAY_FLAT.forEach(function(it){ (byType[it.atype]=byType[it.atype]||[]).push(it); });
  Object.keys(byType).forEach(function(t){
    opts+='<optgroup label="'+t+'">';
    byType[t].forEach(function(it){ opts+='<option value="'+it.c+'"'+(it.c===selectedCode?' selected':'')+'>'+it.c+' · '+it.n+'</option>'; });
    opts+='</optgroup>';
  });
  return opts;
}
function postingLinesEditor(idx){
  var r=APP.rules[idx];
  return r.lines.map(function(l,li){
    var isDr=!!l.dr; var code=isDr?l.drc:l.crc;
    return '<div class="flex g2 ac" style="margin-bottom:6px">'
      + '<select class="cfg-input2" style="width:70px" onchange="setPostingLineDC('+idx+','+li+',this.value)"><option'+(isDr?' selected':'')+'>DR</option><option'+(!isDr?' selected':'')+'>CR</option></select>'
      + '<select class="cfg-input2" style="flex:1" onchange="setPostingLineAcct('+idx+','+li+',this.value)">'+coaOptions(code)+'</select>'
      + (r.lines.length>2?'<button class="x-btn" onclick="removePostingLine('+idx+','+li+')">'+svg('trash')+'</button>':'<span style="width:28px;flex-shrink:0"></span>')
    + '</div>';
  }).join('');
}
function setPostingLineDC(idx,li,dc){
  var l=APP.rules[idx].lines[li]; var code=l.dr?l.drc:l.crc; var name=l.dr||l.cr;
  if(dc==='DR'){ delete l.cr; delete l.crc; l.dr=name; l.drc=code; }
  else { delete l.dr; delete l.drc; l.cr=name; l.crc=code; }
  markPostingEdited(idx); reopenPostingDrawer(idx);
}
function setPostingLineAcct(idx,li,code){
  var l=APP.rules[idx].lines[li]; var k=klayByCode(code);
  var nm = code==='var'?'Dynamic (by item)':(k?k.n:code);
  if(l.dr!==undefined){ l.dr=nm; l.drc=code; } else { l.cr=nm; l.crc=code; }
  l.tax = !!(k && (k.group.indexOf('Tax')>=0));
  l.ctrl = !!(k && k.ctrl);
  markPostingEdited(idx); reopenPostingDrawer(idx);
}
function addPostingLine(idx){ APP.rules[idx].lines.push({dr:'Dynamic (by item)',drc:'var'}); markPostingEdited(idx); reopenPostingDrawer(idx); }
function removePostingLine(idx,li){ APP.rules[idx].lines.splice(li,1); markPostingEdited(idx); reopenPostingDrawer(idx); }
function reopenPostingDrawer(idx){ openPostingRule(idx); renderPage(); }
function editPostingField(idx,field,val){ APP.rules[idx][field]=val; markPostingEdited(idx); }
function savePostingRule(idx){ closeDrawer(); renderPage(); toast('Template saved','Changes to '+APP.rules[idx].name+' saved.','success'); }
function addPostingRule(){ APP.postingNewForm={name:'',lines:[{t:'DR',name:'',code:'var'},{t:'CR',name:'',code:'var'}]}; APP.view='posting-new'; render(); }
function cancelNewPostingRule(){ APP.postingNewForm=null; APP.view='stage'; render(); }
function renderNewPostingRule(){
  var f=APP.postingNewForm;
  var lineRows=f.lines.map(function(l,i){
    return '<div class="flex g2 ac" style="margin-bottom:8px">'
      + '<select class="cfg-input2" style="width:74px" onchange="newRuleLine('+i+',\'t\',this.value)"><option'+(l.t==='DR'?' selected':'')+'>DR</option><option'+(l.t==='CR'?' selected':'')+'>CR</option></select>'
      + '<select class="cfg-input2" style="flex:1" onchange="newRuleSetAcct('+i+',this.value)">'+coaOptions(l.code||'var')+'</select>'
      + (f.lines.length>2?'<button class="x-btn" onclick="newRuleRemoveLine('+i+')">'+svg('trash')+'</button>':'<span style="width:28px"></span>')
    + '</div>';
  }).join('');
  return '<div class="canvas narrow">'
    + '<div class="flex ac g2 fs13 mb4"><span class="clickable" style="color:var(--color-action);font-weight:600" onclick="cancelNewPostingRule()">Posting Rules</span><span class="muted">/</span><span class="muted">New template</span></div>'
    + '<div class="page-head-row"><div><div class="page-title" style="font-size:30px">New posting template</div>'
      + '<div class="page-sub mt2">Give the template a name and define the journal it produces. Dimensions are tagged automatically from the required dimensions of the accounts you choose.</div></div>'
      + '<button class="btn btn-ghost" onclick="cancelNewPostingRule()">Cancel</button></div>'
    + '<div class="card card-pad mb5">'
      + '<div class="section-label mb2">Template name</div><input class="cfg-input2" id="nrName" placeholder="e.g. Bank Charges" value="'+f.name.replace(/"/g,'&quot;')+'" onchange="APP.postingNewForm.name=this.value">'
    + '</div>'
    + '<div class="card card-pad mb5">'
      + '<div class="flex jb ac mb3"><span class="fw7 fs15">Journal template</span><button class="btn btn-ghost btn-sm" onclick="newRuleAddLine()">'+svg('plus')+'Add line</button></div>'
      + '<div class="fs12 muted mb3">Leave a line as <b>Dynamic</b> for an account resolved at posting time (e.g. expense by item). Debits and credits must balance at posting time.</div>'
      + lineRows
      + '<div class="flex g2 ac mt3" style="align-items:flex-start;background:var(--color-surface-base);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:11px 13px;font-size:12px;color:var(--color-text-secondary);line-height:1.5">'+svg('info')+'<span>Dimensions to tag are inherited from each account\'s required dimensions — configure those in <b>Configure Klay CoA</b>.</span></div>'
    + '</div>'
    + '<div class="flex jb ac"><button class="btn btn-ghost" onclick="cancelNewPostingRule()">Cancel</button>'
      + '<button class="btn btn-primary" onclick="saveNewPostingRule()">'+svg('check')+'Create template</button></div>'
    + postingSwitchStyle()
    + '</div>';
}
function newRuleLine(i,field,val){ APP.postingNewForm.lines[i][field]=val; }
function newRuleSetAcct(i,code){ var l=APP.postingNewForm.lines[i]; var k=klayByCode(code); l.code=code; l.name=(code==='var')?'Dynamic (by item)':(k?k.n:code); }
function newRuleAddLine(){ APP.postingNewForm.lines.push({t:'DR',name:'',code:'var'}); render(); }
function newRuleRemoveLine(i){ APP.postingNewForm.lines.splice(i,1); render(); }
function newRuleToggleDim(id){ var d=APP.postingNewForm.dims; var i=d.indexOf(id); if(i>=0)d.splice(i,1); else d.push(id); render(); }
function saveNewPostingRule(){
  var f=APP.postingNewForm;
  var lines=f.lines.map(function(l){ var o={}; var nm=l.name||(l.code&&l.code!=='var'?(klayByCode(l.code)||{}).n:'Dynamic (by item)'); if(l.t==='DR'){o.dr=nm||'Account';o.drc=l.code||'var';}else{o.cr=nm||'Account';o.crc=l.code||'var';} var k=klayByCode(l.code); if(k&&k.ctrl)o.ctrl=true; if(k&&k.group&&k.group.indexOf('Tax')>=0)o.tax=true; return o; });
  APP.rules.push({id:'custom'+APP.rules.length,name:f.name||'New Template',status:'active', ai:false, recommend:null, saved:true,
    lines:lines,note:'Custom template you created.'});
  APP.postingNewForm=null; APP.view='stage'; render(); toast('Template created',(f.name||'New Template')+' added and saved for go-live.','success');
}
function savePostingRule(idx){ var r=APP.rules[idx]; if(r){r.saved=true;} closeDrawer(); renderPage(); toast('Template saved',(r?r.name:'Template')+' will be created in your live ERP.','success'); }
function unsavePostingRule(idx){ var r=APP.rules[idx]; if(r){r.saved=false;} renderPage(); toast('Removed from go-live',(r?r.name:'Template')+' won\u2019t be carried to the ERP.','info'); }
function saveAllAiPosting(){
  var n=0; APP.rules.forEach(function(r){ if(r.ai&&!r.saved){r.saved=true;n++;} });
  renderPage(); toast('Saved '+n+' template'+(n!==1?'s':''),'All AI-drafted templates will be created in your live ERP.','success');
}
function resetPosting(){
  openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--warning-surface)"><svg viewBox="0 0 24 24" style="stroke:var(--warning-text)">'+IC.replace+'</svg></div>'
    + '<div class="modal-title">Reset saved templates?</div>'
    + '<div class="modal-text">This unsaves every posting template, so none will be carried to your live ERP. The templates themselves stay on the page \u2014 you can save them again anytime.</div>'
    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-brand" onclick="doResetPosting()">'+svg('replace')+'Reset</button></div></div>');
}
function doResetPosting(){ APP.rules.forEach(function(r){r.saved=false;}); APP.confirmed.posting=false; closeModal(); renderPage(); toast('Templates reset','Nothing is saved for go-live. Save the ones you want.','info'); }
function continuePosting(){
  var c=postingCounts();
  if(c.saved===0){
    openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--warning-surface)"><svg viewBox="0 0 24 24" style="stroke:var(--warning-text)">'+IC.alert+'</svg></div>'
      + '<div class="modal-title">No templates saved yet</div>'
      + '<div class="modal-text">You haven\u2019t saved any posting templates, so <b>none will be created in your live ERP</b>. You can save them now, or continue and add them later.</div>'
      + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal();jumpStage(5)">Continue anyway</button><button class="btn btn-primary" onclick="closeModal()">Back to set up</button></div></div>');
    return;
  }
  if(c.aiUnsaved>0){
    openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--warning-surface)"><svg viewBox="0 0 24 24" style="stroke:var(--warning-text)">'+IC.alert+'</svg></div>'
      + '<div class="modal-title">'+c.aiUnsaved+' template'+(c.aiUnsaved>1?'s':'')+' not saved</div>'
      + '<div class="modal-text">'+c.saved+' saved, but '+c.aiUnsaved+' AI-drafted template'+(c.aiUnsaved>1?'s are':' is')+' still unsaved and <b>won\u2019t go to your live ERP</b>. Save '+(c.aiUnsaved>1?'them':'it')+' first, or continue without.</div>'
      + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal();confirmStage(\'posting\')">Continue without</button><button class="btn btn-primary" onclick="closeModal();saveAllAiPosting()">Save all '+c.aiUnsaved+'</button></div></div>');
    return;
  }
  confirmStage('posting');
}
function deletePostingRule(idx){
  var name=APP.rules[idx].name;
  openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--danger-surface)"><svg viewBox="0 0 24 24" style="stroke:var(--danger-text)">'+IC.trash+'</svg></div>'
    + '<div class="modal-title">Delete '+name+'?</div><div class="modal-text">This posting rule will be removed. Events of this type will fall back to a manual journal until you add a new rule.</div>'
    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-brand" onclick="doDeletePostingRule('+idx+')">'+svg('trash')+'Delete rule</button></div></div>');
}
function doDeletePostingRule(idx){ var name=APP.rules[idx].name; APP.rules.splice(idx,1); closeModal(); closeDrawer(); renderPage(); toast('Rule deleted',name+' removed.','info'); }
function skipPostingRules(){
  openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--warning-surface)"><svg viewBox="0 0 24 24" style="stroke:var(--warning-text)">'+IC.alert+'</svg></div>'
    + '<div class="modal-title">Skip posting rules?</div>'
    + '<div class="modal-text">If you skip this step, <b>no posting rules will be set up in your live Klay ERP</b>. Every transaction will have to be journalized manually until you add rules later — no automatic debit/credit, tax, or dimension posting.</div>'
    + '<label class="flex g3" style="align-items:flex-start;background:var(--color-surface-base);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:14px;cursor:pointer"><input type="checkbox" id="skipchk" onchange="document.getElementById(\'skipbtn\').disabled=!this.checked" style="margin-top:2px;width:16px;height:16px;accent-color:var(--danger-text)"><span class="fs13 sec" style="line-height:1.55">I understand no posting rules will be active in the live ERP, and transactions will need manual journals.</span></label>'
    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Go back</button><button class="btn btn-brand" id="skipbtn" disabled onclick="doSkipPostingRules()">Skip posting rules</button></div></div>');
}
function doSkipPostingRules(){ APP.postingSkipped=true; closeModal(); jumpStage(5); toast('Posting rules skipped','No rules will be active in the live ERP. You can add them anytime before go-live.','info'); }
</script>
<script>

      {code:'PPh 4(2)', desc:'Final tax — rent of land/building, construction', rateType:'pct', rate:10, acct:'22130', on:true},

      {code:'PPN11_OUT', name:'PPN 11% Output', cat:'Output VAT', applies:'Sales Invoice', rateType:'pct', rate:11, base:'DPP', recov:false, account:'22000', notes:'Domestic sales', active:true, builtin:true},
      {code:'PPN11_IN', name:'PPN 11% Input', cat:'Input VAT', applies:'Purchase Invoice', rateType:'pct', rate:11, base:'DPP', recov:true, account:'11400', notes:'Creditable VAT', active:true, builtin:true},

function renderTax(){
  ensureTax(); var t=APP.taxCfg;
  function glPick(code,i,needs){
    var k=code?klayByCode(code):null;
    var miss = needs && !code;
    var lbl=k?('<span class="mono fs11 muted">'+k.c+'</span> '+shortName(k.n)):('<span class="'+(miss?'gl-miss':'muted')+'">'+(miss?'Choose account':'Select…')+'</span>');
    return '<button class="gl-pick'+(miss?' gl-pick-miss':'')+'" onclick="pickTaxCodeAccount('+i+')">'+lbl+'<span class="gl-chev">'+svg('chevDown')+'</span></button>';
  }
  function rateCell(tc,i){
    if(tc.rateType==='pct') return '<div class="rate-field"><input class="cfg-inline rate-in" value="'+tc.rate+'" onchange="editTaxCode('+i+',\'rate\',this.value)"><span class="rate-suffix">%</span></div>';
    if(tc.rateType==='variable') return '<span class="badge b-neutral" style="font-size:10px">Variable</span>';
    if(tc.rateType==='calc') return '<span class="badge b-neutral" style="font-size:10px">Calculated</span>';
    return '—';
  }
  // hide pure-PPN codes when non-PKP
  var visibleCodes = t.taxCodes.filter(function(tc){
    if(t.pkp) return true;
    return tc.cat.indexOf('VAT')<0 && tc.code.indexOf('PPN')<0;
  });
  var rows = visibleCodes.map(function(tc){
    var i = t.taxCodes.indexOf(tc);
    var locked = !!tc.builtin; // structural fields locked for built-in codes
    var codeCell = locked
      ? '<span class="mono fs12 fw7">'+tc.code+'</span>'
      : '<input class="tc-in mono" style="width:120px;font-weight:700" value="'+tc.code.replace(/"/g,'&quot;')+'" onchange="editTaxCode('+i+',\'code\',this.value)">';
    var nameCell = locked
      ? '<span class="fw6 fs13">'+tc.name+'</span>'
      : '<input class="tc-in" style="width:150px" value="'+tc.name.replace(/"/g,'&quot;')+'" onchange="editTaxCode('+i+',\'name\',this.value)">';
    var offPill = tc.active ? '' : ' <span class="badge b-neutral" style="font-size:9px">Off</span>';
    return '<tr style="'+(tc.active?'':'background:var(--color-surface-base)')+'">'
      + '<td>'+codeCell+'</td>'
      + '<td><span style="'+(tc.active?'':'opacity:.55')+'">'+nameCell+'</span>'+offPill+'</td>'
      + '<td><span class="fs12 sec" style="'+(tc.active?'':'opacity:.55')+'">'+tc.cat+'</span></td>'
      + '<td><span class="fs12 muted" style="'+(tc.active?'':'opacity:.55')+'">'+tc.applies+'</span></td>'
      + '<td class="tr" style="'+(tc.active?'':'opacity:.55')+'">'+rateCell(tc,i)+'</td>'
      + '<td><span class="fs12 muted" style="'+(tc.active?'':'opacity:.55')+'">'+tc.base+'</span></td>'
      + '<td class="tc" style="'+(tc.active?'':'opacity:.55')+'"><label class="switch"><input type="checkbox" '+(tc.recov?'checked':'')+' onchange="editTaxCode('+i+',\'recov\',this.checked)"><span class="track"></span></label></td>'
      + '<td>'+glPick(tc.account,i,(tc.active))+'</td>'
      + '<td><input class="tc-in" style="width:150px;'+(tc.active?'':'opacity:.55')+'" value="'+(tc.notes||'').replace(/"/g,'&quot;')+'" onchange="editTaxCode('+i+',\'notes\',this.value)"></td>'
      + '<td class="tc"><div class="flex ac g1" style="justify-content:center"><label class="switch"><input type="checkbox" '+(tc.active?'checked':'')+' onchange="editTaxCode('+i+',\'active\',this.checked)"><span class="track"></span></label></div></td>'
      + '<td>'+(locked?'':'<button class="x-btn" onclick="deleteTaxCode('+i+')" title="Delete custom code">'+svg('trash')+'</button>')+'</td>'
    + '</tr>';
  }).join('');

  var workspace = ''
    + '<div class="card mb5" style="overflow:hidden">'
      + '<div class="card-pad" style="padding-bottom:0"><div class="flex jb ac mb2"><div class="disp" style="font-size:19px">Tax Codes</div><span class="badge b-neutral" style="font-size:10px">'+visibleCodes.length+' codes</span></div>'
        + '<div class="fs13 muted mb4" style="line-height:1.5">The master list of tax codes your ERP applies to transactions. Standard codes have their <b>category, applies-to and tax base</b> locked to Indonesian rules; you can edit the <b>rate, account, recoverable flag, notes</b>. Codes that don\'t apply to your entity are switched <b>Off</b> by default — turn one <b>On</b> only if you\'re obligated to use it. Each active code needs an account (AI-recommended '+aiDot()+').</div></div>'
      + '<div class="prev-scroll"><div class="prev-scroll-inner"><table class="tbl tax-tbl"><thead><tr>'
        + '<th>Tax Code</th><th>Tax Name</th><th>Tax Category</th><th>Applies To</th><th class="tr">Rate</th><th>Tax Base</th><th class="tc">Recoverable</th><th>Account</th><th>Notes</th><th class="tc">Active</th><th></th>'
        + '</tr></thead><tbody>'+rows+'</tbody></table></div></div>'
      + '<div class="card-pad" style="padding-top:14px"><button class="btn btn-ghost btn-sm" onclick="addTaxCode()">'+svg('plus')+'Add tax code</button></div>'
    + '</div>'
    // faktur settings — only relevant when PKP; system pre-filled (NOT AI)
    + (t.pkp? '<div class="card card-pad mb5"><div class="flex jb ac mb2"><div class="flex ac g2"><span class="disp" style="font-size:19px">Faktur Pajak Settings</span></div>'
      + '<span class="badge b-neutral" style="font-size:10px">'+svg('info')+'System default</span></div>'
      + '<div class="fs13 muted mb4" style="line-height:1.5">Pre-filled from the standard PKP faktur format. Adjust to match your DJP registration.</div>'

        + taxFieldSelect('Reporting basis','basis',t.faktur.basis,['Accrual','Cash'])
      + '</div></div>' : '');

  var rail = aiSummaryCard('tax') + activityLogCard('tax');

  // validation: an active tax code that posts tax must have an account chosen
  var incomplete = visibleCodes.filter(function(tc){ return tc.active && !tc.account; });

    '<div class="flex g2 ac mb5" style="align-items:flex-start;background:var(--warning-surface);border:1px solid var(--warning-border);border-radius:var(--radius-md);padding:12px 15px;font-size:12.5px;color:var(--warning-text);line-height:1.55">'+svg('alert')+'<span><b>'+incomplete.length+' active tax code'+(incomplete.length>1?'s':'')+' still need'+(incomplete.length>1?'':'s')+' an account.</b> Choose an account for '+incomplete.map(function(c){return c.code;}).join(', ')+' before continuing — or turn the code off if your entity doesn\'t use it.</span></div>';

  return '<div class="canvas">'
    + '<div class="page-head-row"><div><div class="page-eyebrow">Stage 3 of 6 · <span class="days">Day '+STAGES[2].day+' of 30</span></div>'
      + '<div class="page-title">Tax Configuration</div>'
      + '<div class="page-sub">Set up the tax codes your ERP applies to transactions — rate, tax base, and the account each one posts to. Klay recommends the accounts; adjust where your entity differs.</div></div>'
      + '<button class="btn btn-primary" '+(taxReady?'onclick="confirmStage(\'tax\')"':'disabled title="Resolve the missing accounts first"')+'>'+svg('check')+'Confirm &amp; continue '+svg('arrowRight')+'</button></div>'
    + blockBanner
    + '<div class="flex g2 ac mb5" style="align-items:flex-start;background:var(--color-surface-base);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:12px 15px;font-size:12.5px;color:var(--color-text-secondary);line-height:1.55">'+svg('info')+'<span>Your entity tax profile — PKP status, NPWP and e-Faktur — is on your migration dashboard. This entity is set up as <b>'+(t.pkp?'PKP (collects &amp; remits PPN)':'Non-PKP')+'</b>'+(t.pkp?'':' — PPN codes are hidden')+'.</span></div>'
    + '<div class="ws-2col">'
      + '<div class="ws-main">'+workspace+'</div>'
      + '<div class="ws-rail">'+rail+'</div>'
    + '</div>'
    + '<style>.cfg-inline{border:1px solid var(--color-border-default);border-radius:var(--radius-sm);padding:8px 10px;font-size:13px;font-family:var(--font-sans);background:#fff}.cfg-inline:focus{outline:none;border-color:var(--color-action)}.cfg-inline.mono{font-family:var(--font-mono)}'
      + '.rate-field{display:inline-flex;align-items:center;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);background:#fff;overflow:hidden;width:78px}.rate-field:focus-within{border-color:var(--color-action)}.rate-in{border:none!important;width:100%;text-align:right;padding:7px 4px 7px 8px;font-family:var(--font-mono);font-size:12px}.rate-in:focus{outline:none}.rate-suffix{padding:0 8px 0 3px;color:var(--color-text-tertiary);font-weight:700;font-size:12px;background:var(--color-surface-sunken);align-self:stretch;display:flex;align-items:center}'
      + '.tax-tbl td{white-space:nowrap;vertical-align:middle}.tax-tbl .tc{text-align:center}.tc-in{border:1px solid transparent;border-radius:var(--radius-sm);padding:5px 7px;font-size:12px;font-family:var(--font-sans);background:transparent;color:var(--color-text-primary)}.tc-in:hover{border-color:var(--color-border-default)}.tc-in:focus{outline:none;border-color:var(--color-action);background:#fff}.tc-in.mono{font-family:var(--font-mono)}'
      + '.gl-pick{display:inline-flex;align-items:center;gap:6px;justify-content:space-between;min-width:130px;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);background:#fff;padding:6px 8px;font-size:12px;cursor:pointer;font-family:var(--font-sans);color:var(--color-text-secondary)}.gl-pick:hover{border-color:var(--color-action)}.gl-chev{display:inline-flex;color:var(--color-text-tertiary)}.gl-chev svg{width:13px;height:13px}.gl-pick-miss{border-color:var(--warning-border);background:var(--warning-surface)}.gl-miss{color:var(--warning-text);font-weight:600}</style>'
    + '</div>';
}
