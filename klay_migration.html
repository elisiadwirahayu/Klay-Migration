function saveNewTaxCode(){
  var d=APP.taxDraft;
  if(!d.code || !d.code.trim()){ toast('Tax code required','Enter a short code, e.g. PPH15.','warning'); return; }
  if(!d.name || !d.name.trim()){ toast('Tax name required','Give the code a readable name.','warning'); return; }
  var rate = d.rateType==='pct' ? (parseFloat(String(d.rate).replace(/[^0-9.]/g,''))||0) : undefined;
  APP.taxCfg.taxCodes.push({ code:d.code.trim().toUpperCase(), name:d.name.trim(), cat:d.cat, applies:d.applies,
    rateType:d.rateType, rate:rate, base:d.base, recov:!!d.recov, account:d.account||'', notes:d.notes||'', active:true, builtin:false });
  APP.taxDraft=null; closeDrawer(); renderPage(); toast('Tax code added',d.code.trim().toUpperCase()+' added to your tax codes.','success');
}
function togglePph(i,v){ APP.taxCfg.pph[i].on=v; renderPage(); toast(APP.taxCfg.pph[i].code+(v?' enabled':' disabled'),'','info'); }
</script>
<script>
/* ============================================================
   STAGE 5 — UAT (sandbox ERP)
   ============================================================ */
function ensureUAT(){
  if(APP.uat) return;
  APP.uat={ tasks:[
    {id:'je',   label:'Manual journal entry', desc:'Post a balanced manual journal in the live ERP, then open the Trial Balance and confirm debits equal credits.', icon:'book',    dest:'Journal Entry', mode:null, done:false},
    {id:'bill', label:'Record a vendor bill', desc:'Create a vendor bill, post it to the GL, then check the Trial Balance reflects the AP and tax.',               icon:'truck',   dest:'Bills → New bill', mode:null, done:false},
    {id:'inv',  label:'Record a customer invoice', desc:'Issue a sales invoice, post it to the GL, then check the Trial Balance reflects the AR and Output VAT.',        icon:'receipt', dest:'Invoices → New invoice',  mode:null, done:false}
  ]};
}
// Base URL of the live (pre-go-live) Klay ERP environment.
// NOTE: the ERP is a client-side SPA on GitHub Pages, so deep links (e.g. /journal-entry)
// 404 on a hard load. We always open the app ROOT and tell the user which menu to click.
var ERP_BASE='https://fzerlina.github.io/klay/';
function erpUrl(){ return ERP_BASE; }
function uatDone(){ return APP.uat.tasks.filter(function(t){return t.done;}).length; }
function uatTaskById(id){ return APP.uat.tasks.filter(function(t){return t.id===id;})[0]; }
function markTask(id){ var t=uatTaskById(id); if(t)t.done=true; }

function renderUAT(){
  ensureUAT();
  if(APP.uat.view==='run' && APP.uat.activeTask) return uatRunPage(APP.uat.activeTask);
  return uatSummary();
}
function uatGoto(v){ APP.uat.view=v; renderPage(); }
function uatOpenTask(id){ APP.uat.view='run'; APP.uat.activeTask=id; renderPage(); }
function uatBackToSummary(){ APP.uat.view='summary'; APP.uat.activeTask=null; renderPage(); }

function uatSummary(){
  var u=APP.uat; var done=uatDone(); var allDone=done===u.tasks.length;
  var cards=u.tasks.map(function(t,i){
    var modeTag = t.mode? '<span class="badge '+(t.mode==='real'?'b-info':'b-neutral')+'" style="font-size:9.5px">'+(t.mode==='real'?'Go-live data':'Simulation')+'</span>' : '';
    return '<div class="card clickable" style="padding:18px 20px" onclick="uatOpenTask(\''+t.id+'\')" onmouseover="this.style.boxShadow=\'var(--shadow-md)\'" onmouseout="this.style.boxShadow=\'var(--shadow-sm)\'">'
      + '<div class="flex jb ac mb2"><div style="width:42px;height:42px;border-radius:var(--radius-md);background:'+(t.done?'var(--success-surface)':'var(--color-brand-wash)')+';display:flex;align-items:center;justify-content:center;color:'+(t.done?'var(--success-text)':'var(--color-brand)')+'">'+svg(t.done?'checkCircle':t.icon)+'</div>'
      + (t.done?'<span class="badge b-success" style="font-size:10px">'+svg('check')+'Verified</span>':'<span class="badge b-neutral" style="font-size:10px">To try</span>')+'</div>'
      + '<div class="flex ac g2 mb1" style="flex-wrap:wrap"><span class="fs11 muted mono">Scenario '+(i+1)+'</span>'+modeTag+'</div>'
      + '<div class="fw7 fs15 mb1">'+t.label+'</div><div class="fs12 muted" style="line-height:1.5;margin-bottom:10px">'+t.desc+'</div>'
      + '<div class="fs12 fw6" style="color:var(--color-action)">'+(t.done?'Run again':'Start scenario')+' '+svg('arrowRight')+'</div>'
    + '</div>';
  }).join('');

  var workspace = ''
    + '<div class="card card-pad mb5" style="background:linear-gradient(160deg,var(--color-brand-wash),#fff)">'
      + '<div class="flex jb ac mb3"><div class="flex ac g2" style="color:var(--color-brand-hover);font-weight:700">'+svg('rocket')+'UAT scenarios</div><span class="fs13 muted"><b class="num" style="color:var(--color-text-primary);font-size:16px">'+done+'</b> of '+u.tasks.length+' verified</span></div>'
      + '<div class="pbar"><span style="width:'+(done/u.tasks.length*100)+'%;background:var(--color-brand)"></span><span style="width:'+((u.tasks.length-done)/u.tasks.length*100)+'%;background:transparent"></span></div>'
    + '</div>'
    + '<div class="flex g2 ac mb5" style="align-items:flex-start;background:var(--color-action-wash);border:1px solid var(--color-action-subtle);border-radius:var(--radius-md);padding:12px 15px;font-size:12.5px;color:var(--color-action);line-height:1.55">'+svg('info')+'<span>Each scenario opens your <b>live Klay ERP</b> in a new tab — already loaded with your migrated data, but <b>not yet go-live</b>. Try the flow there, come back here, and mark it verified. You\'ll still do a final sign off before going live.</span></div>'
    + uatHowAccordion()
    + '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:8px">'+cards+'</div>';

  return '<div class="canvas">'
    + '<div class="page-head-row"><div><div class="page-eyebrow">Stage 5 of 6 · <span class="days">Day '+STAGES[4].day+' of 30</span></div>'
      + '<div class="page-title">User Acceptance Testing</div>'
      + '<div class="page-sub">Try your real Klay ERP before go-live. Each scenario walks the full path — <b>input → post to GL → check the Trial Balance</b> — inside the actual product, using your migrated data.</div></div>'
      + '<button class="btn '+(allDone?'btn-primary':'btn-ghost')+'" '+(allDone?'onclick="jumpStage(6)"':'disabled title="Verify all scenarios first"')+'>Continue to sign off '+svg('arrowRight')+'</button></div>'
    + '<div class="ws-2col">'
      + '<div class="ws-main">'+workspace+'</div>'
      + '<div class="ws-rail">'+activityLogCard('uat',true)+'</div>'
    + '</div>'
    + '</div>';
}

function uatRunPage(id){
  var t=uatTaskById(id); if(!t) return uatSummary();
  var modeChosen=!!t.mode;
  var modeCard = ''
    + '<div class="card card-pad mb5">'
      + '<div class="section-label mb3">Step 1 \u00b7 What are you entering?</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
        + uatModeOption(id,'sim','Simulation','Throwaway test data \u2014 just to see the flow work. Won\'t be kept at go-live.', t.mode==='sim')
        + uatModeOption(id,'real','Real go-live data','An actual opening transaction you want carried into production once you go live.', t.mode==='real')
      + '</div>'
    + '</div>';

  var root=erpUrl();
  var tbRoot=erpUrl(); // ERP root; TB reached via menu (SPA — deep links 404 on GH Pages)
  var lockStyle = modeChosen?'':'opacity:.5;pointer-events:none';
  var noun = (id==='je'?'journal entry':(id==='bill'?'vendor bill':'customer invoice'));
  var shortNoun = (id==='je'?'journal':(id==='bill'?'bill':'invoice'));
  var opened = !!t.opened;
  var launchCard = ''
    + '<div class="card card-pad mb5" style="'+lockStyle+'">'
      + '<div class="section-label mb3">Step 2 \u00b7 Record it in the ERP</div>'
      + '<div class="flex jb ac" style="gap:16px;flex-wrap:wrap">'
        + '<div class="flex g3 ac" style="align-items:flex-start;flex:1;min-width:260px"><div style="width:38px;height:38px;border-radius:var(--radius-md);background:var(--color-action-wash);color:var(--color-action);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+svg(t.icon)+'</div>'
          + '<div><div class="fw6 fs14">Open Klay ERP, then go to <b>'+t.dest+'</b></div><div class="fs12 muted" style="margin-top:2px">Record the '+noun+' and post it to the General Ledger.</div></div></div>'
        + '<a class="btn '+(opened?'btn-ghost':'btn-primary')+'" href="'+root+'" target="_blank" rel="noopener" onclick="markErpOpened(\''+id+'\')" style="flex-shrink:0;text-decoration:none">'+svg('external')+(opened?'Re-open ERP':'Open ERP')+'</a>'
      + '</div>'
      + '<div class="flex jb ac" style="gap:16px;flex-wrap:wrap;border-top:1px solid var(--color-border-subtle);padding-top:14px;margin-top:14px">'
        + '<div class="flex g3 ac" style="align-items:flex-start;flex:1;min-width:260px"><div style="width:38px;height:38px;border-radius:var(--radius-md);background:var(--color-action-wash);color:var(--color-action);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+svg('scale')+'</div>'
          + '<div><div class="fw6 fs14">Then open <b>Trial Balance</b></div><div class="fs12 muted" style="margin-top:2px">Confirm your '+shortNoun+' posted and total debits equal total credits.</div></div></div>'
        + '<a class="btn btn-ghost" href="'+tbRoot+'" target="_blank" rel="noopener" style="flex-shrink:0;text-decoration:none">'+svg('external')+'Open Trial Balance</a>'
      + '</div>'
      + (opened? '<div class="flex g2 ac mt4" style="align-items:flex-start;background:var(--success-surface);border:1px solid var(--success-border);border-radius:var(--radius-md);padding:11px 14px;font-size:12.5px;color:var(--success-text);line-height:1.5">'+svg('checkCircle')+'<span><b>Recorded in the ERP sandbox.</b> We detected your '+shortNoun+' posted to the General Ledger and the Trial Balance is back in balance. Review it in the ERP tab, then confirm below.</span></div>':'')
    + '</div>';

  // Step 3 only "unlocks" once the ERP was opened — keeps the flow seamless on return
  var verifyLock = (modeChosen && opened)?'':'opacity:.5;pointer-events:none';
  var verifyCard = ''
    + '<div class="card card-pad" style="'+verifyLock+'">'
      + '<div class="section-label mb3">Step 3 \u00b7 Confirm the result</div>'
      + (t.done
          ? '<div class="flex jb ac"><div class="flex g2 ac" style="color:var(--success-text)">'+svg('checkCircle')+'<span class="fw6 fs14">Scenario verified'+(t.mode?' \u00b7 '+(t.mode==='real'?'go-live data':'simulation'):'')+'</span></div>'
            + '<button class="btn btn-ghost btn-sm" onclick="unverifyTask(\''+id+'\')">Undo</button></div>'
          : '<div class="flex jb ac" style="gap:12px;flex-wrap:wrap"><div class="fs13 muted" style="flex:1;min-width:220px;line-height:1.5">'+(opened?'Looks good? Mark this scenario verified and move on to the next one.':'Open the ERP above and record the '+shortNoun+' first.')+'</div>'
            + '<button class="btn btn-primary" onclick="verifyTask(\''+id+'\')"'+(opened?'':' disabled')+'>'+svg('check')+'Mark verified</button></div>')
    + '</div>';

  return '<div class="canvas narrow">'
    + '<div class="flex ac g2 fs13 mb4"><span class="clickable" style="color:var(--color-action);font-weight:600" onclick="uatBackToSummary()">UAT scenarios</span><span class="muted">/</span><span class="muted">'+t.label+'</span></div>'
    + '<div class="page-head-row"><div><div class="page-title" style="font-size:28px">'+t.label+(t.done?' <span class="badge b-success" style="font-size:11px;vertical-align:middle">'+svg('check')+'Verified</span>':'')+'</div>'
      + '<div class="page-sub mt2">'+t.desc+'</div></div>'
      + '<button class="btn btn-ghost" onclick="uatBackToSummary()">'+svg('arrowLeft')+'Back</button></div>'
    + modeCard
    + launchCard
    + verifyCard
    + '<style>.mode-opt{border:1.5px solid var(--color-border-default);border-radius:var(--radius-md);padding:14px;cursor:pointer;transition:border-color var(--tf),background var(--tf)}.mode-opt:hover{border-color:var(--color-text-tertiary)}.mode-opt.sel{border-color:var(--color-action);background:var(--color-action-wash)}'
      + '.mode-opt .mo-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px;margin-bottom:4px}.mode-opt .mo-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--color-border-strong);flex-shrink:0}.mode-opt.sel .mo-radio{border-color:var(--color-action);background:var(--color-action);box-shadow:inset 0 0 0 3px #fff}</style>'
    + '</div>';
}
function uatHowAccordion(){
  var open=APP.uat.howOpen===true;
  var steps=[
    {n:'1', title:'Choose what you\'ll enter', body:'Simulation, or the real opening transaction you\'ll keep at go-live.'},
    {n:'2', title:'Open the ERP & record it', body:'Open Klay ERP, go to the right screen, and post the entry to the GL.'},
    {n:'3', title:'Check the Trial Balance', body:'Confirm your entry landed and debits equal credits.'},
    {n:'4', title:'Mark it verified', body:'Come back here and mark the scenario verified.'}
  ];
  var body = open ? '<div style="padding:2px 18px 16px"><div class="how-grid">'
    + steps.map(function(s){ return '<div class="flex g2" style="align-items:flex-start"><span class="run-step-n">'+s.n+'</span><div><div class="fw7 fs12.5">'+s.title+'</div><div class="fs11 muted" style="line-height:1.45">'+s.body+'</div></div></div>'; }).join('')
    + '</div></div>' : '';
  return '<div class="card mb5" style="overflow:hidden">'
    + '<div class="flex jb ac clickable" style="padding:13px 18px" onclick="APP.uat.howOpen='+(open?'false':'true')+';renderPage()">'
      + '<div class="flex ac g2" style="font-weight:700;font-size:13px;color:var(--color-text-secondary)">'+svg('info')+'How this works</div>'
      + '<span class="acc-chev'+(open?' open':'')+'">'+svg('chevDown')+'</span>'
    + '</div>'
    + body
    + '<style>.how-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.run-step-n{width:22px;height:22px;border-radius:50%;background:var(--color-brand);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}@media(max-width:760px){.how-grid{grid-template-columns:repeat(2,1fr)}}</style>'
  + '</div>';
}
function uatModeOption(id,mode,title,body,sel){
  return '<div class="mode-opt'+(sel?' sel':'')+'" onclick="setUatMode(\''+id+'\',\''+mode+'\')">'
    + '<div class="mo-h"><span class="mo-radio"></span>'+title+'</div>'
    + '<div class="fs12 muted" style="line-height:1.5;padding-left:24px">'+body+'</div>'
  + '</div>';
}
function setUatMode(id,mode){ var t=uatTaskById(id); if(t)t.mode=mode; renderPage(); }
function markErpOpened(id){
  var t=uatTaskById(id); if(!t) return;
  t.opened=true;
  // simulate the round-trip: by the time the user comes back, the page already reflects
  // that the entry posted and the TB rebalanced — they just confirm.
  setTimeout(function(){ renderPage(); }, 50);
  toast('Recorded in ERP sandbox', 'Your '+(id==='je'?'journal entry':(id==='bill'?'bill':'invoice'))+' posted to the GL. Come back to this tab to confirm.', 'success');
}
function verifyTask(id){ markTask(id); var t=uatTaskById(id); renderPage(); toast('Scenario verified',(t?t.label:'Scenario')+' marked complete.','success'); }
function unverifyTask(id){ var t=uatTaskById(id); if(t)t.done=false; renderPage(); }

</script>
<script>
/* ============================================================
   STAGE 6 — SIGN OFF
   ============================================================ */
function ensureSignoff(){
  if(APP.checklist) return;
  APP.checklist=[
    {id:'data', label:'All 9 data files uploaded, validated and locked', auto:function(){return APP.uploads.every(function(u){return u.status==='locked';});}, done:false},
    {id:'map', label:'Every legacy account mapped and confirmed (or deactivated)', auto:function(){if(!APP.mapRows)return false;var c=mapCounts();return c.mapped+c.deactivated===c.all;}, done:false},
    {id:'rules', label:'Posting rules reviewed and approved', done:false},
    {id:'tax', label:'Tax profile, PPN and PPh withholding configured', done:false},
    {id:'uat', label:'UAT completed and signed off by Finance', auto:function(){return APP.uat&&uatDone()===APP.uat.tasks.length;}, done:false},
    {id:'open', label:'Opening trial balance ties to the legacy system', done:false},
    {id:'team', label:'Go-live date agreed with the migration team', done:false}
  ];
  APP.approvals=[
    {role:'Prepared by', name:'Ron Weasly', sub:'Admin', color:'#1A46C8', signed:false, you:true},
    {role:'Reviewed by', name:'Severus Snape', sub:'Finance Manager', color:'#B83D08', signed:false},
    {role:'Approved by', name:'Albus Dumbledore', sub:'CFO', color:'#0E7C86', signed:true, at:'30 May 2026 (16:20)'}
  ];
}
function checklistState(){
  return APP.checklist.map(function(c){ return c.auto? c.auto() : c.done; });
}
function renderSignoff(){
  ensureSignoff();
  var states=checklistState();
  var doneN=states.filter(Boolean).length;
  var allChecks=doneN===APP.checklist.length;
  var signedN=APP.approvals.filter(function(a){return a.signed;}).length;
  var allSigned=signedN===APP.approvals.length;
  var ready = allChecks && allSigned;

  // split auto (system-verified) vs manual (you confirm)
  var autoItems=[], manualItems=[];
  APP.checklist.forEach(function(c,i){ (c.auto?autoItems:manualItems).push({c:c,i:i,on:states[i]}); });

  function checkRow(o){
    var c=o.c, i=o.i, on=o.on, isAuto=!!c.auto;
    if(isAuto){
      return '<div class="signrow '+(on?'on':'')+'">'
        + '<span class="signrow-ic" style="color:'+(on?'var(--success-text)':'var(--color-text-tertiary)')+'">'+svg(on?'checkCircle':'clock')+'</span>'
        + '<span class="fs13 '+(on?'fw6':'sec')+'" style="flex:1">'+c.label+'</span>'
        + '<span class="badge '+(on?'b-success':'b-neutral')+'" style="font-size:10px">'+(on?'Verified by system':'Pending')+'</span></div>';
    }
    return '<label class="signrow clickable '+(on?'on':'')+'">'
      + '<input type="checkbox" '+(c.done?'checked':'')+' onchange="toggleCheck('+i+',this.checked)" style="width:18px;height:18px;accent-color:var(--success-text)">'
      + '<span class="fs13 '+(on?'fw6':'sec')+'" style="flex:1">'+c.label+'</span>'
      + '<span class="fs11 muted">You confirm</span></label>';
  }

  var approvals=APP.approvals.map(function(a,i){
    var youTag = a.you? ' <span class="badge b-info" style="font-size:9px">You</span>':'';
    var action;
    if(a.signed){ action='<span class="badge b-success">'+svg('checkCircle')+(a.role==='Approved by'?'Approved':'Signed')+'</span>'; }
    else if(a.you){ action='<button class="btn btn-primary btn-sm" onclick="signApproval('+i+')">'+svg('check')+'Sign off</button>'; }
    else { action='<span class="badge b-warning" style="font-size:10px">'+svg('clock')+'Waiting</span>'; }
    return '<div class="card" style="padding:16px 18px;'+(a.signed?'border-color:var(--success-border);background:var(--success-surface)':'')+'"><div class="section-label mb2">'+a.role+'</div>'
      + '<div class="flex jb ac"><div class="flex ac g2"><span class="avatar" style="width:32px;height:32px;background:'+(a.color||'var(--color-action)')+'">'+a.name.split(' ').map(function(w){return w[0];}).slice(0,2).join('')+'</span><div><div class="fw7 fs14">'+a.name+youTag+'</div><div class="fs12 muted">'+a.sub+'</div></div></div>'
      + action+'</div>'
      + (a.signed&&a.at? '<div class="fs11 muted mt2 mono">'+(a.role==='Approved by'?'Approved ':'Signed ')+a.at+'</div>':'')
      + (!a.signed&&!a.you? '<div class="fs11 muted mt2">Waiting for '+a.name.split(' ')[0]+' to '+(a.role==='Approved by'?'approve':'review &amp; sign')+'</div>':'')+'</div>';
  }).join('');

  return '<div class="canvas narrow">'
    + '<div class="page-head-row"><div><div class="page-eyebrow">Stage 6 of 6 · <span class="days">Day '+STAGES[5].day+' of 30</span></div>'
      + '<div class="page-title">Sign Off</div>'
      + '<div class="page-sub">The last step before PT Makmur Jaya goes live. Klay verifies what it can automatically; you confirm the rest and collect approvals.</div></div></div>'
    // readiness banner with two clear sub-progress
    + '<div style="border-radius:var(--radius-lg);overflow:hidden;background:linear-gradient(115deg,'+(ready?'#1A5E36,#27814A':'#4E1A07,#8A3210')+');padding:26px 28px;color:#fff;margin-bottom:26px">'
      + '<div class="flex jb ac" style="flex-wrap:wrap;gap:16px"><div><div class="disp" style="font-size:28px;margin-bottom:4px">'+(ready?'Ready to go live 🚀':'Almost there')+'</div>'
      + '<div style="font-size:13.5px;color:rgba(255,255,255,.78)">Complete the checklist and collect all approvals to unlock go-live.</div></div>'
      + '<button class="btn" style="background:#fff;color:'+(ready?'#1A5E36':'#8A3210')+';font-weight:700;padding:13px 24px;'+(ready?'':'opacity:.5;cursor:not-allowed')+'" '+(ready?'onclick="goLive()"':'disabled')+'>'+svg('rocket')+'Go live</button></div>'
      + '<div class="flex g6 mt5" style="flex-wrap:wrap">'
        + signoffMini('Checklist',doneN,APP.checklist.length)
        + signoffMini('Approvals',signedN,APP.approvals.length)
      + '</div>'
    + '</div>'
    // checklist: system-verified
    + '<div class="card card-pad mb5"><div class="flex ac g2 mb1"><span class="disp" style="font-size:18px">Verified automatically</span><span class="badge b-success" style="font-size:10px">'+svg('shield')+'System</span></div>'
      + '<div class="fs13 muted mb4">Klay checks these from the work you\'ve already done. Nothing to do unless one is still pending.</div>'
      + autoItems.map(checkRow).join('')+'</div>'
    // checklist: manual
    + '<div class="card card-pad mb5"><div class="disp" style="font-size:18px;margin-bottom:2px">Your confirmations</div>'
      + '<div class="fs13 muted mb4">Tick each item once you\'ve verified it with your team.</div>'
      + manualItems.map(checkRow).join('')+'</div>'
    // approvals
    + '<div class="card card-pad mb5"><div class="disp" style="font-size:18px;margin-bottom:2px">Approvals</div>'
      + '<div class="fs13 muted mb4">Each approver signs off in turn. All three are required before go-live.</div>'
      + '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">'+approvals+'</div></div>'
    // sign-off document (PDF + offline)
    + '<div class="card card-pad"><div class="flex jb ac mb2"><div class="disp" style="font-size:18px">Sign-off document</div>'
      + (APP.signoffPdfReady?'<span class="badge b-success" style="font-size:10px">'+svg('check')+'Generated</span>':'')+'</div>'
      + '<div class="fs13 muted mb4" style="line-height:1.55">Prefer a paper trail? Generate a sign-off sheet listing every checklist item, the system verifications, and signature blocks for your records.</div>'
      + '<div style="border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:16px">'
        + '<div class="flex ac g2 mb2 fw7 fs14">'+svg('file')+'Generate PDF</div>'
        + '<div class="fs12 muted mb3" style="line-height:1.5">A formatted sign-off sheet for PT Makmur Jaya with all checks and signature lines.</div>'
        + '<button class="btn btn-soft btn-sm" onclick="generateSignoffPdf()">'+svg('download')+(APP.signoffPdfReady?'Download again':'Generate sign-off PDF')+'</button>'
      + '</div></div>'
    + '<style>.signrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--color-border-default);border-radius:var(--radius-md);margin-bottom:8px;transition:all var(--tf)}.signrow.on{background:var(--success-surface);border-color:var(--success-border)}.signrow-ic svg{width:18px;height:18px}</style>'
    + '</div>';
}
function signoffMini(label,n,total){
  var pct=Math.round(n/total*100);
  return '<div style="flex:1;min-width:200px"><div class="flex jb ac mb1"><span class="fs12" style="color:rgba(255,255,255,.8);font-weight:600">'+label+'</span><span class="num fs12" style="color:#fff">'+n+'/'+total+'</span></div>'
    + '<div style="height:7px;background:rgba(255,255,255,.22);border-radius:var(--radius-full);overflow:hidden"><div style="height:100%;width:'+pct+'%;background:#fff;border-radius:var(--radius-full);transition:width .4s"></div></div></div>';
}
function toggleCheck(i,v){ APP.checklist[i].done=v; renderPage(); }
function signApproval(i){
  var a=APP.approvals[i];
  openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--color-action-wash)"><svg viewBox="0 0 24 24" style="stroke:var(--color-action)">'+IC.shield+'</svg></div>'
    + '<div class="modal-title">Sign off as '+a.role.replace(/^.*by /,'')+'?</div>'
    + '<div class="modal-text">You\'re recording approval as <b>'+a.name+'</b> ('+a.sub+'). This is logged with your name and a timestamp, and confirms the migration is ready for go-live from your side.</div>'
    + '<label class="flex g3" style="align-items:flex-start;background:var(--color-surface-base);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:14px;cursor:pointer"><input type="checkbox" id="signchk" onchange="document.getElementById(\'signbtn\').disabled=!this.checked" style="margin-top:2px;width:16px;height:16px;accent-color:var(--color-action)"><span class="fs13 sec" style="line-height:1.55">I have reviewed the migration and approve it for go-live.</span></label>'
    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="signbtn" disabled onclick="doSignApproval('+i+')">'+svg('check')+'Confirm sign off</button></div></div>');
}
function generateSignoffPdf(){
  openModal('<div class="modal-card tc"><div class="modal-icon" style="background:var(--color-action-wash);margin:0 auto 16px"><svg viewBox="0 0 24 24" style="stroke:var(--color-action)">'+IC.file+'</svg></div>'
    + '<div class="modal-title" style="text-align:center">Generating sign-off PDF…</div>'
    + '<div class="modal-text" style="text-align:center" id="pdfStatus">Collecting checklist items and verifications…</div>'
    + '<div class="pbar" style="margin:6px 0 4px"><span id="pdfBar" style="width:8%;background:var(--color-action);transition:width .4s"></span></div></div>');
  var steps=['Collecting checklist items and verifications…','Adding approval blocks and signature lines…','Rendering PT Makmur Jaya letterhead…','Finalizing document…'];
  var i=0;
  var iv=setInterval(function(){
    i++; var bar=document.getElementById('pdfBar'), st=document.getElementById('pdfStatus');
    if(bar) bar.style.width=(8+i*23)+'%';
    if(st&&steps[i]) st.textContent=steps[i];
    if(i>=3){ clearInterval(iv); APP.signoffPdfReady=true;
      openModal('<div class="modal-card tc"><div class="modal-icon" style="background:var(--success-surface);margin:0 auto 16px"><svg viewBox="0 0 24 24" style="stroke:var(--success-text)">'+IC.checkCircle+'</svg></div>'
        + '<div class="modal-title" style="text-align:center">Sign-off PDF ready</div>'
        + '<div class="modal-text" style="text-align:center"><span class="mono">Klay_SignOff_PTMakmurJaya.pdf</span> — 1 page. Print it for wet signatures, or share it for digital approval.</div>'
        + '<div class="modal-foot" style="justify-content:center"><button class="btn btn-ghost" onclick="closeModal();renderPage()">Close</button><button class="btn btn-primary" onclick="closeModal();renderPage();toast(\'Downloaded\',\'Klay_SignOff_PTMakmurJaya.pdf saved.\',\'success\')">'+svg('download')+'Download PDF</button></div></div>');
    }
  },480);
}
function offlineSignoff(){
  openModal('<div class="modal-card"><div class="modal-icon" style="background:var(--color-action-wash)"><svg viewBox="0 0 24 24" style="stroke:var(--color-action)">'+IC.upload+'</svg></div>'
    + '<div class="modal-title">Record offline sign-off</div>'
    + '<div class="modal-text">Confirm that the printed sign-off sheet has been signed by all approvers, and attach the scanned copy. This marks all three approvals as signed (offline).</div>'
    + '<div style="border:1.5px dashed var(--color-action-subtle);border-radius:var(--radius-md);background:var(--color-action-wash);padding:22px;text-align:center;margin-bottom:8px">'+svg('upload')+'<div class="fs13 sec mt2">Drop the signed PDF/scan here, or click to browse</div><div class="fs11 muted mt1">PDF or image · Max 20 MB</div></div>'
    + '<label class="flex g3" style="align-items:flex-start;background:var(--color-surface-base);border:1px solid var(--color-border-default);border-radius:var(--radius-md);padding:14px;cursor:pointer;margin-top:12px"><input type="checkbox" id="offchk" onchange="document.getElementById(\'offbtn\').disabled=!this.checked" style="margin-top:2px;width:16px;height:16px;accent-color:var(--color-action)"><span class="fs13 sec" style="line-height:1.55">I confirm all required approvers have signed the printed sheet.</span></label>'
    + '<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="offbtn" disabled onclick="doOfflineSignoff()">'+svg('check')+'Mark as signed offline</button></div></div>');
}
function doOfflineSignoff(){
  var now=(new Date()).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' · '+(new Date()).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  APP.approvals.forEach(function(a){ if(!a.signed){ a.signed=true; a.at=now+' (offline)'; } });
  closeModal(); renderPage(); toast('Offline sign-off recorded','All approvals marked signed from the scanned sheet.','success');
}
function doSignApproval(i){
  APP.approvals[i].signed=true;
  APP.approvals[i].at=(new Date()).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' · '+(new Date()).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  closeModal(); renderPage(); toast('Approval signed',APP.approvals[i].name+' signed off.','success');
}
function goLive(){
  openModal('<div class="modal-card tc"><div class="modal-icon" style="background:var(--success-surface);margin:0 auto 18px"><svg viewBox="0 0 24 24" style="stroke:var(--success-text)">'+IC.rocket+'</svg></div>'
    + '<div class="modal-title" style="text-align:center">PT Makmur Jaya is live on Klay</div>'
    + '<div class="modal-text" style="text-align:center">Migration complete in 29 days — within the 30-day window, so your full first-month cashback applies. Your team can start working in production now.</div>'
    + '<div class="modal-foot" style="justify-content:center"><button class="btn btn-primary" onclick="closeModal();goHome()">'+svg('check')+'Back to overview</button></div></div>');
}

/* ============================================================
   INIT
   ============================================================ */
function afterRender(){
  // (UAT now runs in the external ERP — no in-page previews to hydrate)
}
render();
</script>
</body>
